[project]
name = "dmtools"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "amitools>=0.8",
    "machine68k>=0.4.1",
    "mcp>=2.3.0",
]

[project.scripts]
dm-extract = "dmtools.extract:main"
dm-ftl = "dmtools.ftl:main"
dm-mcp = "dmtools.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmtools"]

[dependency-groups]
dev = [
    "dmcsb>=0.2.1",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
timeout = 120
testpaths = ["tests"]
