[project]
name = "dmtools"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "amitools>=0.8",
    "machine68k>=0.4.1",
    "mcp>=2.3.0",
]

[project.scripts]
dm-extract = "dmtools.extract:main"
dm-ftl = "dmtools.ftl:main"
dm-mcp = "dmtools.mcp_server:main"
dm-play = "dmtools.play:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/dmtools"]

[dependency-groups]
dev = [
    "clang-format>=23.1,<24",
    "dmcsb>=0.2.1",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]
research = [
    "capstone>=5.0.9",
    "numpy>=2.5.4",
]

[tool.pytest.ini_options]
timeout = 120
addopts = "--dist loadfile"
pythonpath = ["tests"]
testpaths = ["tests"]
