[project]
name = "dmtools"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["amitools>=0.8"]

[project.scripts]
dm-extract = "dmtools.extract:main"
dm-ftl = "dmtools.ftl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmtools"]

[dependency-groups]
dev = [
    "machine68k>=0.4.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
